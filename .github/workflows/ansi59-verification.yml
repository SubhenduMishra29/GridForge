name: ANSI 59 verification

on:
  push:
    branches:
      - 'remediation/ansi59-clean-startup'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install protection test dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy
      - name: Verify canonical protection imports
        run: >-
          python -c "from core.protection.voltage import OverVoltageRelay, OverVoltageSettings, UnderVoltageRelay, UnderVoltageSettings; from core.protection.function_catalog import get_protection_function; assert get_protection_function('59').implementation is OverVoltageRelay"
      - name: Run ANSI 27 and ANSI 59 protection tests
        run: >-
          python -m pytest -q
          tests/core/protection/test_overvoltage_59_contract.py
          tests/core/protection/test_undervoltage_27_contract.py
          tests/core/protection/test_function_catalog_59.py
          tests/core/protection/test_voltage_package_exports.py
