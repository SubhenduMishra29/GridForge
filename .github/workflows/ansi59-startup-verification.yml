name: ANSI 59 startup verification

on:
  push:
    branches:
      - 'verification/ansi59-startup'

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install startup dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run application startup command
        run: timeout 20s python main.py
