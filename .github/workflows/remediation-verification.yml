name: GridForge remediation verification

on:
  workflow_dispatch:
  push:
    branches:
      - remediation/final-application-core-2026-09-09

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python sources
        run: python -m compileall -q core tests
      - name: Run tests
        run: python -m pytest -q
