name: GridForge startup verification

on:
  push:
    branches:
      - main
      - 'remediation/**'
  pull_request:
    branches:
      - main

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install headless Qt runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install canonical runtime and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Verify source integrity and syntax
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/verify_startup.py

      - name: Run targeted startup regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/startup/test_startup_lifecycle.py

      - name: Run relevant regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/core/persistence/test_project_persistence_sld.py
          tests/core/application/test_project_lifecycle_r3.py
          tests/ui/sld/test_project_dirty_authority_r3.py
          tests/application/test_transient_stability_execution.py
          tests/application/test_transient_stability_registration.py
          tests/analysis/test_dynamic_initial_state_preparation.py
          tests/analysis/test_transient_network_coupling.py
          tests/analysis/test_transient_runtime_events.py
          tests/analysis/test_transient_event_state.py
          tests/solver/dynamics/test_transient_event_boundary.py

      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
