name: GridForge targeted remediation

on:
  push:
    branches:
      - 'remediation/**'

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair accidental Markdown fencing in workspace
        run: |
          files=(
            "core/measurement/measurement_channel.py"
            "core/solver/dynamics/state_vector.py"
          )
          for file in "${files[@]}"; do
            if [ "$(head -n 1 "$file")" = '```python' ]; then
              sed -i '1d' "$file"
            fi
            if [ "$(tail -n 1 "$file")" = '```' ]; then
              sed -i '$d' "$file"
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy
      - name: Verify source syntax
        run: >-
          python -m py_compile
          ui/events/sld_update_coordinator.py
          ui/events/update_boundary.py
          ui/projection/ui_projection_coordinator.py
          ui/projection/element_list_projection.py
          ui/projection/project_hierarchy_projection.py
          ui/projection/validation_projection.py
          ui/projection/study_projection.py
          main.py
          tests/core/persistence/test_project_persistence_sld.py
          tests/core/application/test_project_lifecycle_r3.py
          tests/ui/sld/test_project_dirty_authority_r3.py
          tests/application/test_transient_stability_execution.py
          tests/application/test_transient_stability_registration.py
          tests/analysis/test_dynamic_initial_state_preparation.py
          tests/analysis/test_transient_network_coupling.py
          tests/analysis/test_transient_runtime_events.py
          tests/analysis/test_transient_event_state.py
          tests/solver/dynamics/test_transient_event_boundary.py
      - name: Run GF-AUD-019 transient remediation tests
        run: >-
          python -m pytest -q
          tests/application/test_transient_stability_execution.py
          tests/application/test_transient_stability_registration.py
          tests/analysis/test_dynamic_initial_state_preparation.py
          tests/analysis/test_transient_network_coupling.py
          tests/analysis/test_transient_runtime_events.py
          tests/analysis/test_transient_event_state.py
          tests/solver/dynamics/test_transient_event_boundary.py
